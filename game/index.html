<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunreach Bay</title>
<style>
  :root { --ink: #fff8ec; --shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 12px rgba(0,0,0,.35); --pink: #ff5fa2; --teal: #2ee6d6; --gold: #ffcf5a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3c9a4; font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; color: var(--ink); user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hidden { display: none !important; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud .tr { position: absolute; top: 14px; right: 18px; text-align: right; }
  #money { font-size: 30px; font-weight: 800; color: #9dffb0; text-shadow: var(--shadow); letter-spacing: 1px; }
  #stars { font-size: 26px; letter-spacing: 3px; margin-top: 2px; text-shadow: var(--shadow); }
  #stars .on { color: var(--gold); }
  #stars .off { color: rgba(255,255,255,.25); }
  #stars.flash .on { animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #weapon { margin-top: 4px; font-size: 15px; font-weight: 700; text-shadow: var(--shadow); }
  #objective { position: absolute; top: 14px; left: 18px; max-width: 42%; padding: 8px 12px; background: linear-gradient(90deg, rgba(20,10,35,.72), rgba(20,10,35,0)); border-left: 4px solid var(--pink); font-size: 15px; line-height: 1.35; text-shadow: 0 1px 0 #000; }
  #objective b { display: block; font-size: 11px; letter-spacing: 3px; color: var(--pink); text-transform: uppercase; }
  #timer { color: var(--gold); font-weight: 800; }
  #mapwrap { position: absolute; left: 18px; bottom: 16px; width: 176px; }
  #minimap { width: 176px; height: 176px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 4px 16px rgba(0,0,0,.4); display: block; background: #1b4f6b; }
  .bar { height: 7px; margin-top: 6px; background: rgba(0,0,0,.45); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; border-radius: 4px; }
  #hp i { background: linear-gradient(90deg, #ff4d6d, #ff8fa3); }
  #armor i { background: linear-gradient(90deg, #4cc9f0, #a0e7ff); }
  #place { position: absolute; left: 206px; bottom: 18px; text-shadow: var(--shadow); }
  #place .d { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  #place .s { font-size: 13px; opacity: .85; }
  #speedo { position: absolute; right: 22px; bottom: 18px; text-align: right; text-shadow: var(--shadow); }
  #speedo .n { font-size: 44px; font-weight: 900; font-style: italic; }
  #speedo .u { font-size: 13px; opacity: .8; }
  #speedo .car { font-size: 13px; color: var(--teal); }
  #toast { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: 800; text-shadow: var(--shadow); opacity: 0; transition: opacity .25s; }
  #big { position: absolute; top: 36%; left: 0; right: 0; text-align: center; font-size: 64px; font-weight: 900; font-style: italic; letter-spacing: 4px; text-shadow: 0 4px 0 rgba(0,0,0,.6); opacity: 0; transition: opacity .4s; }
  #big small { display: block; font-size: 20px; letter-spacing: 2px; font-style: normal; font-weight: 700; }
  #subtitle { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); max-width: 60%; text-align: center; font-size: 18px; padding: 6px 14px; background: rgba(0,0,0,.45); border-radius: 6px; }
  #subtitle b { color: var(--gold); }
  #prompt { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); font-size: 15px; padding: 5px 12px; background: rgba(0,0,0,.55); border-radius: 4px; }
  #prompt kbd { background: #fff; color: #222; border-radius: 3px; padding: 0 6px; font-weight: 800; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; }
  #hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px rgba(255,0,40,.0); transition: box-shadow .2s; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #title { background: linear-gradient(180deg, rgba(40,10,60,.0) 30%, rgba(40,10,60,.65)); }
  #title h1 { margin: 0; font-size: 92px; font-style: italic; font-weight: 900; letter-spacing: 6px; background: linear-gradient(180deg, #fff3b0 10%, #ff9e5e 50%, #ff4f9a 90%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 rgba(60,10,60,.7)); }
  #title h2 { margin: -6px 0 22px; font-size: 18px; letter-spacing: 12px; color: #fff; text-shadow: var(--shadow); }
  .menu { display: flex; flex-direction: column; gap: 8px; min-width: 260px; }
  .menu button { pointer-events: auto; font: inherit; font-size: 20px; font-weight: 800; letter-spacing: 2px; padding: 10px 20px; color: #fff; background: rgba(20,10,35,.6); border: 2px solid rgba(255,255,255,.5); border-radius: 6px; cursor: pointer; text-transform: uppercase; }
  .menu button:hover, .menu button.sel { background: linear-gradient(90deg, #ff5fa2, #ff9e5e); border-color: #fff; }
  .menu button:disabled { opacity: .4; }
  #pause { background: rgba(15,8,30,.6); backdrop-filter: blur(3px); }
  #pause h1 { font-size: 54px; font-style: italic; margin: 0 0 18px; color: var(--gold); text-shadow: var(--shadow); }
  .panel { max-width: 640px; margin-top: 16px; padding: 12px 18px; background: rgba(0,0,0,.45); border-radius: 8px; font-size: 14px; line-height: 1.6; }
  .panel kbd { background: #fff; color: #222; border-radius: 3px; padding: 0 5px; font-weight: 800; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 2px 18px; }
  #hint { margin-top: 18px; font-size: 13px; opacity: .8; text-shadow: var(--shadow); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Sunreach Bay: an open-world crime game in a sunny coastal city"></canvas>
<div id="hud" class="hidden">
  <div id="objective"><b>Objective</b><span id="objtext"></span> <span id="timer"></span></div>
  <div class="tr"><div id="money">$0</div><div id="stars"></div><div id="weapon"></div></div>
  <div id="mapwrap"><canvas id="minimap" width="176" height="176"></canvas><div class="bar" id="hp"><i></i></div><div class="bar" id="armor"><i></i></div></div>
  <div id="place"><div class="d"></div><div class="s"></div></div>
  <div id="speedo" class="hidden"><div class="car"></div><span class="n">0</span> <span class="u">km/h</span></div>
  <div id="crosshair" class="hidden"></div>
  <div id="prompt" class="hidden"></div>
  <div id="subtitle" class="hidden"></div>
  <div id="toast"></div>
  <div id="big"></div>
</div>
<div id="hurt"></div>
<div id="title" class="screen hidden">
  <h1>SUNREACH</h1>
  <h2>BAY</h2>
  <div class="menu" id="titlemenu"></div>
  <div id="hint">Keyboard and mouse &middot; click to look around</div>
</div>
<div id="pause" class="screen hidden">
  <h1>PAUSED</h1>
  <div class="menu" id="pausemenu"></div>
  <div class="panel" id="pausepanel"></div>
</div>
<div id="fade"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
